name: 🐒 Monkey

on:
  schedule:
    - cron: "0 0 * * *" # the daily 10M keystrokes, at midnight UTC
  workflow_dispatch:
  issues:
    types: [opened] # someone fed the monkey a banana

permissions:
  contents: write
  issues: write

# Daily runs and banana feedings both commit, so take turns.
concurrency:
  group: monkey
  cancel-in-progress: false

jobs:
  type:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '🍌')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Let the monkey type
        run: node scripts/monkey.mjs ${{ github.event_name == 'issues' && 'feed' || 'type' }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit the results
        run: |
          git config user.name "the monkey"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet && exit 0
          git commit -m "🐒 $(jq -r '"\(.keystrokes) keystrokes, best: \"\(.best.match)\""' data/state.json)"
          for attempt in 1 2 3; do
            git pull --rebase --strategy-option=theirs && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Reply to the banana
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue close "$ISSUE" --reason completed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
